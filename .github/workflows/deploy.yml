name: Deploy Next.js Website to AWS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: nextjs-static-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Website
        run: npm run build

      - name: Verify Static Build
        run: |
          if [ ! -f "out/index.html" ]; then
            echo "Static build failed: out/index.html not found"
            exit 1
          fi
          echo "Static build verified successfully"

      - name: Debug GitHub OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info('OIDC Claims:');
            core.info(JSON.stringify({
              iss: payload.iss,
              aud: payload.aud,
              sub: payload.sub
            }, null, 2));

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::949049116271:role/github-actions-s3-deployment-role
          aws-region: us-east-1

      - name: Deploy Website to S3
        run: |
          aws s3 sync ./out/ s3://assig-03-origin-server/

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EAW4I5EZZ24TI \
            --paths "/*"